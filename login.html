  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;

      /* ===== BACKGROUND IMAGE ===== */
      background: url("C:\W3_website/mix.png") no-repeat center center fixed;
      background-size: cover;

      position: relative;
      color: #fff;
    }
    

    /* ---------------------- GLASS NAVBAR ---------------------- */
    nav.glass-nav {
      background: rgba(20, 20, 20, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
      animation: fadeDown 1s ease forwards;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Nav Hover */
    .navbar-nav .nav-link:hover {
      color: #ff3366 !important;
      transition: 0.3s;
    }

    /* Profile Icon Glow */
    .profile-pic {
      transition: 0.4s;
      border-radius: 50%;
    }

    .profile-pic:hover {
      color: #ff2e63;
      filter: drop-shadow(0 0 8px #ff2e63);
      transform: scale(1.1);
    }
    /* ===== DARK OVERLAY ===== */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: -1;
    }

    .login-box {
      width: 400px;
      margin: 120px auto;
      padding: 35px;
      background: rgba(28, 28, 28, 0.85);
      border-radius: 15px;
      box-shadow: 0px 0px 20px rgba(255, 71, 71, 0.3);
      backdrop-filter: blur(6px);
    }

    .login-box h2 {
      text-align: center;
      color: #ff4747;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .form-control {
      background: #111;
      border: 1px solid #333;
      color: #fff;
    }
    .form-control:focus {
      background: #111;
      border-color: #ff4747;
      box-shadow: 0 0 5px #ff4747;
      color: #fff;
    }

    .btn-login {
      width: 100%;
      background: #ff4747;
      color: #fff;
      font-weight: bold;
    }
    .btn-login:hover {
      background: #ff3030;
    }

    .extra-links {
      text-align: center;
      margin-top: 15px;
    }
    .extra-links a {
      color: #ff4747;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
        a {
  color: white;
  text-decoration: none;
}
a:hover {
  color: #ff4747; 
}

  </style>
</head>

        <ul class="navbar-nav gap-2">

      <li class="nav-item dropdown">

          </li>
        </ul>

        <ul class="navbar-nav align-items-center gap-3">
          <li class="nav-item">
            <a class="btn btn-danger px-3" href="login.html">Login</a>
          </li>

          <li>
            <a href="profile.html">
              <svg class="profile-pic" xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor"
                viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                <path fill-rule="evenodd"
                  d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
              </svg>
            </a>
          </li>
        </ul>

      </div>
    </div>
  </nav>

<div class="login-box">
  <h2>Login</h2>

  <form>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" placeholder="Enter email" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn btn-login mt-3">Login</button>

    <div class="extra-links">
      <p><a href="#">Forgot Password?</a></p>
      <p>Don't have an account? <a href="#">Register</a></p>
    </div>
  </form>
</div>
