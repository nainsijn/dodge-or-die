<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Landing Animation</title>

<style>
/* ---------- BASIC SETUP ---------- */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:200vh; /* scroll ke liye */
  background:#0d0d0d;
  font-family: 'Poppins', sans-serif;
  color:#fff;
}

/* ---------- MAIN SECTION ---------- */
.hero-section{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ---------- GAME NAME ---------- */
.game-title{
  position:absolute;
  font-size:72px;
  font-weight:800;
  color:#ff4040;
  cursor:pointer;
  transition:all 0.9s ease;
  z-index:10;
}

/* LEFT MOVE */
.hero-section.active .game-title{
  transform:translateX(-380px);
  text-shadow:0 0 20px rgba(255,64,64,0.9);
}

/* ---------- GAME DETAILS ---------- */
.game-details{
  position:absolute;
  right:80px;
  width:420px;
  opacity:0;
  transform:translateX(200px);
  transition:all 0.9s ease;
}

.hero-section.active .game-details{
  opacity:1;
  transform:translateX(0);
}

/* ---------- DETAILS STYLE ---------- */
.game-details h2{
  color:#ffd60a;
  margin-bottom:15px;
}

.game-details p{
  line-height:1.8;
  font-size:17px;
  color:#f5f5f5;
}

.game-details button{
  margin-top:20px;
  padding:12px 28px;
  background:transparent;
  color:#ffd60a;
  border:2px solid #ffd60a;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
}

.game-details button:hover{
  background:#ffd60a;
  color:#000;
  box-shadow:0 0 20px #ffd60a;
}

/* ---------- HINT TEXT ---------- */
.scroll-hint{
  position:absolute;
  bottom:40px;
  font-size:14px;
  opacity:0.6;
}
</style>
</head>

<body>

<div class="hero-section" id="hero">
  <div class="game-title" id="title">NAIT RUN</div>

  <div class="game-details" id="details">
    <h2>About the Game</h2>
    <p>
      A fast-paced 2D platform shooter where survival is the key. 
      Dodge enemies, shoot smart, and run till the end.
    </p>
    <button>Play Game</button>
  </div>

  <div class="scroll-hint">Scroll to reset ⬇</div>
</div>

<script>
const hero = document.getElementById("hero");
const title = document.getElementById("title");

/* HOVER TRIGGER */
title.addEventListener("mouseenter", () => {
  hero.classList.add("active");
});

/* SCROLL RESET (LOOP EFFECT) */
window.addEventListener("scroll", () => {
  hero.classList.remove("active");
});
</script>

</body>
</html>
